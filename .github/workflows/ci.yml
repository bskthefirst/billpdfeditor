name: CI
on:
  push:
    branches: [main, v2]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Fetch fallback fonts (OFL / Apache, served from our own origin at runtime)
        run: node scripts/fetch-fonts.mjs
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
