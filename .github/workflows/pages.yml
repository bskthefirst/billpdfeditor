name: Deploy to GitHub Pages
# Publishes ONE site: the previous app stays at the site root exactly as it is today (Split, PNG/JPG, SVG keep working)
# and v2 is served from /v2/. Only runs on main.
#
# One-time setup before merging: repo Settings -> Pages -> Build and deployment -> Source: "GitHub Actions".
# (Today Pages publishes the files at the root of main directly; after v2 is merged those files are v2's *unbuilt*
# sources, so the old branch-based publishing would show a broken page.)
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: node scripts/fetch-fonts.mjs
      - run: pnpm build
      - name: Assemble the site (old app at the root, v2 at /v2/)
        run: |
          mkdir -p site/v2
          cp -R legacy/. site/
          cp -R dist/. site/v2/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
